# Alembic configuration.
#
# The database URL is deliberately NOT set here: `migrations/env.py` reads it
# from application settings (APP_DATABASE_URL) at runtime. One source of truth,
# and no credentials in a committed file.

[alembic]
script_location = src/api_framework/migrations

# Timestamped, slugged revision filenames sort chronologically in the
# directory listing, which makes the migration history readable at a glance.
# Default hash-only names do not.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

prepend_sys_path = src

# `path_separator` supersedes the legacy `version_path_separator`. Setting it
# explicitly silences Alembic's deprecation warning about falling back to
# splitting paths on spaces and colons - which would break any path containing
# a space (this project's own path does).
path_separator = os

# Treat a "migration" that only adds a comment as a no-op rather than failing.
# revision_environment = false

[post_write_hooks]
# Intentionally empty.
#
# Formatting generated migrations with a post-write hook is tempting, but the
# `exec` hook resolves its executable against PATH, so `alembic revision`
# breaks whenever it is run without an activated virtualenv (for example
# `.venv/bin/python -m alembic ...`, or from an IDE). Ruff also ships no
# console_scripts entry point, so the PATH-independent `console_scripts` hook
# type is not available either.
#
# Migrations are formatted by pre-commit and checked in CI instead, which is
# where style belongs. `pyproject.toml` relaxes a couple of lint rules for
# `migrations/` so generated files pass as-is.
hooks =

# ---------------------------------------------------------------------------
# Logging. Alembic configures logging from this file when run via the CLI.
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# Install once:  pre-commit install
# Run on everything:  pre-commit run --all-files
#
# These hooks are the same checks CI runs, so a failure is caught in seconds
# locally instead of minutes later in a pipeline.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^src/api_framework/migrations/
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      # Two files differing only in case break checkouts on Windows/macOS.
      - id: check-case-conflict
      - id: debug-statements
      # Blocks committing an accidental private key.
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        files: ^src/
        # mypy needs the real dependencies to check against; the hook runs in
        # its own isolated environment, so they are listed explicitly.
        additional_dependencies:
          - pydantic>=2.9
          - pydantic-settings>=2.5
          - fastapi>=0.115
          - sqlalchemy[asyncio]>=2.0
          - types-pyjwt

  - repo: local
    hooks:
      # Cheap guard against the mistake that hurts most: editing a model and
      # forgetting the migration. Full verification is test_migrations.py.
      - id: no-env-file
        name: refuse to commit a .env file
        entry: .env must never be committed - it holds secrets
        language: fail
        files: ^\.env$

[build-system]
requires = ["hatchling>=1.24,<2"]
build-backend = "hatchling.build"

[project]
name = "api-framework"
version = "1.0.0"
description = "Production-grade FastAPI base project: pluggable auth, async SQLAlchemy, Alembic, RFC 9457 errors, structured logging."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["fastapi", "template", "boilerplate", "async", "sqlalchemy", "alembic", "jwt"]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    # [email] pulls in email-validator, required by pydantic's EmailStr.
    "pydantic[email]>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "aiosqlite>=0.20,<1.0",
    "pyjwt[crypto]>=2.9,<3.0",
    "argon2-cffi>=23.1,<26.0",
    "httpx>=0.27,<1.0",
    "python-multipart>=0.0.18,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
    "pre-commit>=4.0,<5.0",
]

[project.scripts]
api-framework = "api_framework.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/api_framework"]

# ---------------------------------------------------------------------------
# Ruff - linting and formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # unused arguments
    "SIM",  # flake8-simplify
    "PTH",  # use pathlib
    "RUF",  # ruff-specific
    "ASYNC",# flake8-async
    "S",    # flake8-bandit (security)
]
# NOTE on the rules deliberately NOT enabled:
#
# TC001/TC002/TC003 (flake8-type-checking) move imports that are "only used in
# annotations" into an `if TYPE_CHECKING:` block. That is actively wrong for a
# FastAPI project: because `from __future__ import annotations` makes
# annotations strings, FastAPI resolves them at runtime to build the dependency
# graph and the OpenAPI schema. An import hidden behind TYPE_CHECKING leaves an
# unresolvable forward reference and the app fails to start with
# "... is not fully defined". Enabling these rules and applying their autofix
# breaks the application - so they stay off. See the comment in db/session.py.
ignore = [
    "B008",  # function call in argument default - required by FastAPI's Depends()
    "S105",  # hardcoded password string - false positives on token-type literals
]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts are the point; fixture arguments are injected, not unused;
# credentials in fixtures are deliberately fake.
"tests/**" = ["S101", "S105", "S106", "ARG001", "ARG005"]
# Generated migrations: Alembic's own style, and its hook signatures have
# arguments we do not use.
"src/api_framework/migrations/**" = ["ARG001", "ARG005", "E501", "W291"]
# SQLAlchemy's TypeDecorator API mandates the `dialect` parameter.
"src/api_framework/db/types.py" = ["ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["api_framework"]

# ---------------------------------------------------------------------------
# mypy - static typing
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false   # FastAPI decorators are untyped
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["api_framework.migrations.*"]
ignore_errors = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --cov=api_framework --cov-report=term-missing"

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
